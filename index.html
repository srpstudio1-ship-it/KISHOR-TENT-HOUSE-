<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Event Stage Visualizer - Royal Marwari & Event Design System</title>
  
  <!-- Google Fonts for Typography Hierarchy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Fira+Code:wght@400;600&family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Master Stylesheet Link -->
  <link rel="stylesheet" href="style.css">

  <!-- Three.js Library Dependency -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Main Application Grid Viewport -->
  <div id="app-viewport">

    <!-- 1. HEADER TOOLBAR -->
    <header class="app-header">
      <div class="brand-container">
        <div class="brand-logo" aria-label="Visualizer Logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="brand-title">3D Stage Studio</h1>
      </div>

      <div class="header-toolbar">
        <button class="header-btn" id="btn-undo" title="Undo Action">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
          Undo
        </button>
        <button class="header-btn" id="btn-redo" title="Redo Action">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
          Redo
        </button>
        <button class="header-btn" id="btn-delete-selected" disabled title="Delete Active Element">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          Delete
        </button>
        <button class="header-btn header-btn--primary" id="btn-export-json" title="Download Layout Payload">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Export Design
        </button>
      </div>
    </header>

    <!-- 2. SIDEBAR ASSET CATALOG PANEL -->
    <aside class="app-sidebar" id="sidebar-panel">
      <!-- Navigation Tabs -->
      <nav class="sidebar-tabs" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true">Catalog</button>
        <button class="tab-btn" role="tab" aria-selected="false">Lighting</button>
        <button class="tab-btn" role="tab" aria-selected="false">Settings</button>
      </nav>

      <!-- Asset Search -->
      <div class="catalog-search-box">
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="catalog-search" placeholder="Search stage props, chairs, lights..." />
        </div>
      </div>

      <!-- Scrollable Asset List -->
      <div class="catalog-content">
        <div class="catalog-section-title">Stage Elements & Furniture</div>
        <div id="catalog-list" class="catalog-list-wrapper">
          <!-- Dynamically Populated via main.js UIController -->
        </div>
      </div>
    </aside>

    <!-- 3. MAIN 3D VIEWPORT CONTAINER -->
    <main id="canvas-container">
      
      <!-- Overlay Floating Controls -->
      <div class="viewport-overlay">
        <button class="tool-btn active" id="btn-mode-orbit" title="Orbit Camera">🎥</button>
        <button class="tool-btn" id="btn-mode-measure" title="Measure Distance">📏</button>
        <button class="tool-btn" id="btn-snapshot" title="Take Render Snapshot">📸</button>
      </div>

      <!-- Floating Real-Time Metrics -->
      <div class="metrics-overlay">
        <div class="metric-item">
          <span class="metric-label">Estimated Cost</span>
          <span class="metric-value" id="budget-counter">₹450,000</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Items Placed</span>
          <span class="metric-value" id="item-counter">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Power Draw</span>
          <span class="metric-value">12.5 KW</span>
        </div>
      </div>

    </main>

    <!-- 4. FOOTER STATUS BAR -->
    <footer class="app-footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>WebGL 2.0 Engine Active</span>
      </div>
      <div>
        <span>Environment: </span>
        <select id="lighting-preset" style="background: transparent; color: var(--clr-primary); border: none; font-weight: 600;">
          <option value="evening-warm" selected>Evening Warmth</option>
          <option value="daylight-bright">Daylight Bright</option>
          <option value="sangeet-party">Sangeet Night Party</option>
          <option value="royal-wedding">Royal Wedding Gold</option>
        </select>
      </div>
      <div class="grid-setting">
        <label style="cursor: pointer;">
          <input type="checkbox" id="toggle-grid" checked /> Show Ground Grid
        </label>
      </div>
    </footer>

  </div>

  <!-- Master Engine Script -->
  <script src="main.js"></script>
</body>
</html>
